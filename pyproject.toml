[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "Trợ lý AI trên Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=24.0.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "send2trash>=1.8.0",
    "apscheduler>=3.10.4,<4.0.0",
    "winotify>=1.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]


[project.scripts]
assistant = "assistant.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
