# Cấu hình mặc định của ứng dụng Trợ Lý AI
# Có thể ghi đè các giá trị này qua file .env hoặc biến môi trường tương ứng

[general]
# Thư mục làm việc an toàn trên máy tính
workspace_dir = "C:\\AI_Workspace"

# Thư mục lưu dữ liệu ứng dụng. Để trống sẽ mặc định dùng: %APPDATA%\\AIAssistant
data_dir = ""

# Múi giờ hệ thống
timezone = "Asia/Ho_Chi_Minh"

# Mức độ ghi log (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level = "INFO"

[models]
# Model đám mây qua Gemini API (khi có mạng)
gemini_model = "gemini-2.0-flash"

# Model cục bộ chạy qua Ollama (khi mất mạng hoặc dữ liệu nhạy cảm)
local_model = "qwen2.5:14b"

# Địa chỉ máy chủ Ollama
ollama_host = "http://127.0.0.1:11434"

# Model embedding cho tìm kiếm ngữ nghĩa trí nhớ (nomic-embed-text, all-minilm)
embedding_model = "nomic-embed-text"

# Ngưỡng cảnh báo số request Gemini mỗi ngày
daily_soft_limit = 1000

# Ngân sách token cho cửa sổ ngữ cảnh hội thoại
max_context_tokens = 4000

# Thời gian lưu cache trạng thái kết nối mạng (giây)
network_cache_seconds = 10

[server]
# Cổng web UI cục bộ
ui_port = 8000

[notifications]
# ID chat Telegram nhận thông báo đồng thời trên điện thoại (tùy chọn)
telegram_chat_id = ""


